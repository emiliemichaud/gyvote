<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vote — Accueil</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-config.js"></script>
<script src="app.js"></script>
</head>
<body>
  <div class="masthead">
    <div class="eyebrow">Séance de vote</div>
    <h1>Vote</h1>
  </div>

  <div class="card center stack">
    <div class="eyebrow" style="margin-bottom:4px;">Créer une session</div>
    <p class="hint">
      Crée une nouvelle session, projette le QR code affiché à l'écran suivant,
      et pilote les votes depuis cette même page.
    </p>
    <button id="createBtn">Démarrer une session</button>
    <p id="err" class="hint" style="color:#8c2f27; display:none;"></p>
  </div>

  <div class="card center stack">
    <div class="eyebrow" style="margin-bottom:4px;">Se connecter à une session</div>
    <p class="hint">
      Tu as déjà un code de session ? Saisis-le pour rejoindre le vote.
    </p>
    <input id="joinCode" class="code-input" type="text" placeholder="CODE" maxlength="5"
           autocapitalize="characters" autocomplete="off" inputmode="text" />
    <button id="joinBtn" class="secondary">Rejoindre la session</button>
    <p id="joinErr" class="hint" style="color:#8c2f27; display:none;"></p>
  </div>

  <script>
    document.getElementById("createBtn").addEventListener("click", async () => {
      const btn = document.getElementById("createBtn");
      const err = document.getElementById("err");
      btn.disabled = true;
      err.style.display = "none";
      try {
        const sb = getSupabaseClient();
        const code = generateSessionCode();
        const { data, error } = await sb
          .from("sessions")
          .insert({ code })
          .select("id, code, host_secret")
          .single();
        if (error) throw error;
        const url = new URL("host.html", window.location.href);
        url.searchParams.set("s", data.code);
        url.searchParams.set("t", data.host_secret);
        window.location.href = url.toString();
      } catch (e) {
        err.textContent = "Erreur : " + e.message;
        err.style.display = "block";
        btn.disabled = false;
      }
    });
    document.getElementById("joinBtn").addEventListener("click", () => {
      const joinErr = document.getElementById("joinErr");
      const code = document.getElementById("joinCode").value.trim().toUpperCase();
      joinErr.style.display = "none";
      if (!code) {
        joinErr.textContent = "Saisis d'abord un code de session.";
        joinErr.style.display = "block";
        return;
      }
      window.location.href = voteUrlForCode(code);
    });

    document.getElementById("joinCode").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("joinBtn").click();
    });
  </script>
</body>
</html>
