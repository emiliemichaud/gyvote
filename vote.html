<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vote</title>
<link rel="stylesheet" href="style.css" />
<script src="api-config.js"></script>
<script src="app.js"></script>
</head>
<body>
  <div class="masthead">
    <div class="eyebrow">Bulletin de vote</div>
    <h1 id="title">Vote</h1>
  </div>

  <p id="expiryNote" class="hint" style="display:none; margin-bottom:14px;"></p>

  <div id="app"></div>

  <script>
    const code = getSessionCodeFromLocation();
    const app = document.getElementById("app");

    let session = null, hasVoted = false, votes = [], voting = false;
    let pollTimer = null;
    const voterId = getVoterId();

    function statusLabel(s) {
      return { idle: "En attente du début du vote", voting: "Vote en cours", stopped: "Vote clos", results: "Résultats" }[s] || s;
    }

    function render() {
      if (!session) { app.innerHTML = `<div class="card center hint">Chargement…</div>`; return; }

      if (session.status === "results") {
        renderResults();
        return;
      }

      if (session.status === "voting" && !hasVoted) {
        app.innerHTML = `
          <div class="card center">
            <div class="status-banner voting">Vote en cours</div>
            <p class="hint">Choisissez une option. Vous ne pourrez voter qu'une seule fois.</p>
          </div>
          <div class="choice-grid">
            <button class="choice-btn pour" data-choice="pour">Pour</button>
            <button class="choice-btn contre" data-choice="contre">Contre</button>
            <button class="choice-btn abst" data-choice="abstention">Abstention</button>
          </div>
        `;
        app.querySelectorAll(".choice-btn").forEach((b) => {
          b.onclick = () => castVote(b.dataset.choice);
        });
        return;
      }

      if (hasVoted && session.status !== "results") {
        app.innerHTML = `<div class="card"><div class="locked-msg">✓ Votre vote a été enregistré.<br><span class="hint">${session.status === "voting" ? "En attente de la clôture du vote." : "Les votes sont clos."}</span></div></div>`;
        return;
      }

      const banner = session.status === "stopped" ? `<div class="status-banner stopped">Vote clos</div>` : `<div class="status-banner">${statusLabel(session.status)}</div>`;
      app.innerHTML = `<div class="card center">${banner}<p class="locked-msg" style="margin-top:0;">${session.status === "stopped" ? "Les votes sont clos." : "En attente du début du vote…"}</p></div>`;
    }

    function renderResults() {
      const counts = tallyCounts(votes);
      const total = counts.pour + counts.contre + counts.abstention;
      let verdict = "Égalité";
      let verdictClass = "";
      if (counts.pour > counts.contre) { verdict = "Résultat : Pour"; verdictClass = "pour"; }
      else if (counts.contre > counts.pour) { verdict = "Résultat : Contre"; verdictClass = "contre"; }

      app.innerHTML = `
        <div class="card">
          <div class="verdict ${verdictClass}">${verdict}</div>
          <div class="turnout">${total} votant${total > 1 ? "s" : ""}</div>
          <div class="tally">
            ${tallyRow("Pour", "pour", counts.pour, total)}
            ${tallyRow("Contre", "contre", counts.contre, total)}
            ${tallyRow("Abstention", "abst", counts.abstention, total)}
          </div>
        </div>
      `;
    }

    function tallyRow(label, cls, count, total) {
      const pct = total > 0 ? Math.round((count / total) * 100) : 0;
      return `
        <div class="label ${cls}">${label}</div>
        <div class="count">${count}</div>
        <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
      `;
    }

    async function castVote(choice) {
      if (voting) return;
      voting = true;
      app.querySelectorAll(".choice-btn").forEach((b) => (b.disabled = true));
      try {
        await apiPost("/api/vote", { session_id: session.id, voter_id: voterId, choice });
        hasVoted = true;
        render();
      } catch (e) {
        if (e.message && e.message.includes("Déjà voté")) {
          hasVoted = true;
          render();
        } else {
          alert("Erreur : " + e.message);
          app.querySelectorAll(".choice-btn").forEach((b) => (b.disabled = false));
        }
      } finally {
        voting = false;
      }
    }

    // ─── Polling (remplace Supabase Realtime) ───────────────────────────────
    // Resynchronise le statut et (si résultats) les votes toutes les 3 secondes.

    async function poll() {
      try {
        const newSession = await apiGet(`/api/session/${code.toUpperCase()}`);
        const previousStatus = session ? session.status : null;
        session = newSession;

        // Nouveau tour de vote lancé par l'organisateur
        if (previousStatus !== "idle" && session.status === "idle") {
          hasVoted = false;
          votes = [];
        }

        // Chargement des résultats quand affichés
        if (session.status === "results") {
          votes = await apiGet(`/api/votes/${session.id}`);
        }

        render();
      } catch (e) {
        // Session expirée ou supprimée
        if (e.message && e.message.includes("introuvable")) {
          stopPolling();
          session = null;
          document.getElementById("expiryNote").style.display = "none";
          app.innerHTML = `<div class="card center hint">Cette session a été clôturée automatiquement (15h écoulées) et n'est plus disponible.</div>`;
        }
      }
    }

    // ─── Heartbeat de présence ───────────────────────────────────────────────
    // Signale au serveur que ce votant est connecté (toutes les 10 secondes).
    // Permet à l'animateur de voir le nombre de participants en direct.
    let heartbeatTimer = null;

    async function sendHeartbeat() {
      if (!session) return;
      try {
        await apiPost(`/api/presence/${session.id}`, { voter_id: voterId });
      } catch (_) {
        // Erreur réseau : on ignore, le prochain heartbeat réessaiera
      }
    }

    function startHeartbeat() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      sendHeartbeat(); // envoi immédiat à l'arrivée
      heartbeatTimer = setInterval(sendHeartbeat, 10000);
    }

    function stopHeartbeat() {
      if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(poll, 3000);
    }

    function stopPolling() {
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      stopHeartbeat();
    }

    // ─── Initialisation ─────────────────────────────────────────────────────

    async function init() {
      if (!code) {
        app.innerHTML = `<div class="card center hint">Aucun code de session fourni.</div>`;
        return;
      }
      try {
        session = await apiGet(`/api/session/${code.toUpperCase()}`);
        if (!session) {
          app.innerHTML = `<div class="card center hint">Session introuvable. Vérifiez le code : <strong>${code}</strong></div>`;
          return;
        }

        const expiryNote = document.getElementById("expiryNote");
        const expiry = formatExpiryDate(session);
        if (expiry) {
          expiryNote.textContent = `Cette session expirera automatiquement le ${expiry}.`;
          expiryNote.style.display = "block";
        }

        // Vérifier si on a déjà voté dans cette session
        try {
          const myVotes = await apiGet(`/api/votes/${session.id}`);
          hasVoted = myVotes.some(v => v.voter_id === voterId);
        } catch(_) {}

        if (session.status === "results") {
          votes = await apiGet(`/api/votes/${session.id}`);
        }

        render();
        startPolling();
        startHeartbeat();
      } catch (e) {
        app.innerHTML = `<div class="card center hint">Session introuvable. Vérifiez le code : <strong>${code}</strong></div>`;
      }
    }

    init();
  </script>

  <p class="hint" style="margin-top:16px;"><a href="confidentialite.html">Confidentialité</a></p>
</body>
</html>
